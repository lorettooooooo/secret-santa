# Railway (e la maggior parte dei PaaS) passa la porta in $PORT
server.port=${PORT:8008}
spring.datasource.url=jdbc:h2:file:./data/secretsanta;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
# Mostra al frontend il testo delle ResponseStatusException
server.error.include-message=always
# Change this before exposing the app on the internet.
app.admin-email=${ADMIN_EMAIL:admin@secretsanta.local}
app.admin-key=${ADMIN_KEY:BabboNababbo}
app.base-url=${APP_BASE_URL:https://secret-santa-latintanti.up.railway.app}
# Email via API Brevo (opzionale). Senza chiave, iscrizione ed estrazione funzionano lo stesso:
# password e link privati vengono stampati nel log del server.
app.brevo-api-key=${BREVO_API_KEY:}
app.mail-from=${MAIL_FROM:}
