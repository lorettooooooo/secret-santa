server.port=8080
spring.datasource.url=jdbc:h2:file:./data/secretsanta;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
# Change this before exposing the app on the internet.
app.admin-key=${ADMIN_KEY:change-me-now}
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Optional SMTP configuration. Without it, registration and draw still work;
# private invitation URLs are printed in the server log for local testing.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail-from=${MAIL_FROM:}
